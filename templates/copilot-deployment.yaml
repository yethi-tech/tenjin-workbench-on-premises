apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-copilot
  labels:
    app: copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copilot
  template:
    metadata:
      labels:
        app: copilot
    spec:
      containers:
        - name: copilot
          image: {{ .Values.tenjinkairo.image | default "registry.yethi.in/products/tenjin-workbench/copilot-service:epic-te-8091" }}
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-copilot-config

          volumeMounts:
            - name: wikis
              mountPath: /app/data/wikis

      volumes:
        - name: wikis
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-copilot-wikis-pvc
      imagePullSecrets:
        - name: gitlab-auth

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-copilot-wikis-pvc
spec:
  accessModes:
    - {{ .Values.tenjinkairo.storage.accessMode }}
  storageClassName: {{ .Values.tenjinkairo.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.tenjinkairo.storage.size }}